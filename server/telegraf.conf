# =====================================================================
# GLOBAL AGENT SETTINGS (Controls batching for all plugins)
# =====================================================================
[agent]
  metric_batch_size = 1000
  flush_interval = "2s"
  omit_hostname = true

# =====================================================================
# 1. TELEMETRY INPUT (High Volume)
# =====================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["telemetry/ieq"]
  username = "telegraf"
  password = "password"
  data_format = "json"
  
  # Tell Telegraf this data goes into the "ieq_readings" table
  name_override = "ieq_readings"
  
  # Crucial: Use the timestamp from the JSON payload (seconds)
  json_time_key = "timestamp_unix"
  json_time_format = "unix"

  # device_id is a string, so we must explicitly tell Telegraf it is a tag/field
  json_string_fields = ["device_id"]

  # Drop the auto-generated topic tag
  tagexclude = ["topic"]

  # ONLY allow these exact fields to pass through to the database
  fieldinclude = ["device_id", "battery_percent", "temperature", "pressure", "relative_humidity", "co", "co2", "no2", "o3", "pm25", "hcho", "pm1", "pm10", "tvoc", "radon"]

# =====================================================================
# 2. METADATA INPUT (Low Volume, State Changes)
# =====================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["devices/metadata"]
  username = "telegraf"
  password = "password"
  data_format = "json"
  
  # Tell Telegraf this data goes into the "device_metadata" table
  name_override = "device_metadata"
  
  # Metadata string fields that map directly to your Postgres columns
  json_string_fields = ["device_id", "building_name", "room_name", "location_detail", "node_uuid", "fabric_uuid"]
  
  # Parse the JSON 'last_updated' field as the official metric timestamp
  json_time_key = "last_updated"
  json_time_format = "unix"

  tagexclude = ["topic"]

# =====================================================================
# 3. DATABASE OUTPUT (TimescaleDB / PostgreSQL)
# =====================================================================

# Output for Telemetry (Requires 'time' column)
[[outputs.sql]]
  driver = "pgx"
  data_source_name = "postgres://username:password@localhost:5432/iot_db?sslmode=disable"
  
  # Only process metrics named "ieq_readings"
  namepass = ["ieq_readings"]
  timestamp_column = "time"
  
  [outputs.sql.convert]
    real = "REAL"
    integer = "BIGINT"
    text = "TEXT"
    timestamp = "TIMESTAMPTZ"

# Output for Metadata (Requires 'last_updated' column)
[[outputs.sql]]
  driver = "pgx"
  data_source_name = "postgres://username:password@localhost:5432/iot_db?sslmode=disable"
  
  # Only process metrics named "device_metadata"
  namepass = ["device_metadata"]
  timestamp_column = "last_updated"
  
  [outputs.sql.convert]
    real = "REAL"
    integer = "BIGINT"
    text = "TEXT"
    timestamp = "TIMESTAMPTZ"